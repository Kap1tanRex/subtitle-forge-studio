[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sfstudio"
version = "0.9.0"
description = "SubtitleForge Studio — WYSIWYG subtitle editor"
readme = "README.md"
# Проверено 2026-09-07: все зависимости имеют колёса под 3.14
# (PySide6 cp310-abi3, av cp311-abi3, numpy cp314). Риск R1 закрыт.
requires-python = ">=3.12,<3.16"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]
media = ["av>=12.0", "numpy>=1.26", "python-mpv>=1.0.7"]
io-extra = ["pysubs2>=1.7", "charset-normalizer>=3.3"]
# Проверка орфографии: порт Hunspell на чистом Python, со словарями
# русского и английского в комплекте.
spelling = ["spylls>=0.1.7"]
dev = ["pytest>=8.0", "pytest-cov", "pytest-xdist>=3.5", "hypothesis>=6.0",
       "ruff", "mypy"]

[project.scripts]
sfstudio = "sfstudio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sfstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Тесты идут по файлам в отдельных процессах. Это не про скорость (хотя
# прогон ускорился с двух минут до пятнадцати секунд): в одном процессе
# полторы тысячи тестов с Qt, libmpv и libass копят состояние, и сессия
# начала обрываться падением интерпретатора в конце — при том, что все
# тесты проходили. Изоляция по файлам убирает и это, и взаимные помехи.
# Четыре процесса, а не «сколько ядер»: тесты трогают libmpv, и десяток
# одновременных копий этой библиотеки в системе давал то падение воркера,
# то зависание прогона. На четырёх — стабильно.
addopts = "-q --strict-markers -n 4 --dist loadfile -m \"not serial\""
markers = [
    "needs_gui: requires PySide6",
    "serial: трогает libmpv, libass или подсветку Qt — только последовательно",
    "needs_media: requires PyAV/numpy",
    "needs_native: requires libmpv/libass binaries",
    "slow: измеряет время работы на большом документе",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "PERF", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках/комментариях — намеренно

[tool.ruff.lint.per-file-ignores]
# B008: сигнатуры QAbstractItemModel требуют QModelIndex() как значение
#       по умолчанию — это часть контракта Qt, обойти нельзя.
# ARG002: параметры переопределяемых методов Qt и методов Protocol обязаны
#         присутствовать, даже если конкретная реализация их не использует.
# RUF009: RGBA — frozen-датакласс, разделяемый экземпляр в значении по умолчанию
#         безопасен и дешевле, чем default_factory на каждый объект стиля.
"src/sfstudio/ui/event_table.py" = ["B008"]
"src/sfstudio/ui/preview.py" = ["ARG002"]
"src/sfstudio/ui/timeline.py" = ["ARG002"]
"src/sfstudio/ui/style_dialog.py" = ["ARG002"]
"src/sfstudio/core/commands/base.py" = ["ARG002"]
"src/sfstudio/core/style.py" = ["RUF009"]
# В тестах длинные строки — эталонные данные ASS: перенос изменит содержимое,
# а на нём держится проверка побайтового round-trip.
"tests/**" = ["E501", "ARG001", "ARG002", "SIM117", "RUF059", "UP031", "PERF401"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "Блокирующий вызов. В ui/* запрещён — используйте QTimer."

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/sfstudio/core", "src/sfstudio/io"]
